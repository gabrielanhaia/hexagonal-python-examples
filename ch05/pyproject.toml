[project]
name = "ch05-ports"
version = "1.0.0"
description = "Chapter 5: provider-shaped vs consumer-defined."
requires-python = ">=3.14"
dependencies = [
    "httpx2==2.16.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 68

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["model.py", "provider_shaped", "consumer_defined", "tests"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
