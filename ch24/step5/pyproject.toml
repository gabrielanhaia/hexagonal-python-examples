[project]
name = "ch24-step5"
version = "0.1.0"
description = "Chapter 24, step 5: strangle the rest."
requires-python = ">=3.14"
dependencies = [
    "aiosqlite==0.22.1",
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "import-linter==2.16",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 68

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = [
    "app.main",
    "app.adapters",
    "app.application",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "The core imports no framework and no settings"
type = "forbidden"
source_modules = ["app.application", "app.domain"]
forbidden_modules = [
    "fastapi",
    "httpx2",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "app.settings",
]
