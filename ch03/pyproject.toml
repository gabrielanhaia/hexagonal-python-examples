[project]
name = "ch03-protocols"
version = "1.0.0"
description = "Chapter 3: Protocol and ABC ports, and mypy."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 68

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
# wrong_adapter.py is left out on purpose: mypy rejects it.
files = [
    "protocol_port.py",
    "abc_port.py",
    "runtime_checkable_trap.py",
    "tests",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
