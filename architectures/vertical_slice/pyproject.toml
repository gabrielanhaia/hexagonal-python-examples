[project]
name = "arch-vertical-slice"
version = "1.0.0"
description = "Hold and cancel a room: vertical slice architecture."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "import-linter==2.16",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 68

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["app", "features", "kernel", "tests"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_packages = ["app", "features", "kernel"]

[[tool.importlinter.contracts]]
name = "Slices do not know each other"
type = "independence"
modules = ["features.hold_room", "features.cancel_booking"]

[[tool.importlinter.contracts]]
name = "The shared kernel serves the slices"
type = "layers"
layers = ["app", "features", "kernel"]
