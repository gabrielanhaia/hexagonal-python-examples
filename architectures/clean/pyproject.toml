[project]
name = "arch-clean"
version = "1.0.0"
description = "Hold and cancel a room: Clean Architecture."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "import-linter==2.16",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 68

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = [
    "entities",
    "use_cases",
    "interface_adapters",
    "frameworks",
    "tests",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_packages = [
    "frameworks",
    "interface_adapters",
    "use_cases",
    "entities",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The Dependency Rule: source code points inward"
type = "layers"
layers = [
    "frameworks",
    "interface_adapters",
    "use_cases",
    "entities",
]

[[tool.importlinter.contracts]]
name = "Only the outer circle knows the web framework"
type = "forbidden"
source_modules = [
    "interface_adapters",
    "use_cases",
    "entities",
]
forbidden_modules = ["fastapi", "pydantic", "starlette"]
