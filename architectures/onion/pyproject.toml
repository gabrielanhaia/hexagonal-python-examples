[project]
name = "arch-onion"
version = "1.0.0"
description = "Hold and cancel a room: Onion Architecture."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "import-linter==2.16",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 68

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = [
    "domain_model",
    "domain_services",
    "application_services",
    "infrastructure",
    "ui",
    "tests",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_packages = [
    "ui",
    "infrastructure",
    "application_services",
    "domain_services",
    "domain_model",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Coupling points toward the centre"
type = "layers"
layers = [
    "ui",
    "infrastructure",
    "application_services",
    "domain_services",
    "domain_model",
]

[[tool.importlinter.contracts]]
name = "The application core imports no framework"
type = "forbidden"
source_modules = [
    "application_services",
    "domain_services",
    "domain_model",
]
forbidden_modules = ["fastapi", "pydantic", "starlette"]
