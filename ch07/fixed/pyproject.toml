[project]
name = "ch07-fixed"
version = "1.0.0"
description = "Chapter 7: dependency rule, enforced (fixed)."
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio]==2.1.8",
]

[dependency-groups]
dev = [
    "import-linter==2.16",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "roombook"

[tool.ruff]
line-length = 68

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]

[tool.importlinter]
root_package = "roombook"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = [
    "roombook.adapters",
    "roombook.application",
    "roombook.domain",
]

[[tool.importlinter.contracts]]
name = "The domain imports no framework"
type = "forbidden"
source_modules = ["roombook.domain"]
forbidden_modules = ["sqlalchemy", "pydantic", "fastapi"]
