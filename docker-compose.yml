name: hexagonal-python-examples

x-roombook: &roombook
  build: ./roombook
  image: roombook:1.0.0
  env_file:
    - path: .env
      required: false
  environment:
    ROOMBOOK_DATABASE_URL: >-
      postgresql+psycopg://roombook:roombook@postgres/roombook
    ROOMBOOK_KAFKA_SERVERS: kafka:9092

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: roombook
      POSTGRES_PASSWORD: roombook
      POSTGRES_DB: roombook
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "roombook"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server=localhost:9092
        - --list
      interval: 5s
      retries: 30

  roombook-migrate:
    <<: *roombook
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # docker compose run --rm roombook hold --room atlas ...
  roombook:
    <<: *roombook
    depends_on:
      roombook-migrate:
        condition: service_completed_successfully

  roombook-api:
    <<: *roombook
    entrypoint:
      - uvicorn
      - --factory
      - roombook.composition:create_http_app
      - --host=0.0.0.0
      - --no-access-log
    ports: ["8000:8000"]
    depends_on:
      roombook-migrate:
        condition: service_completed_successfully

  roombook-consumer:
    <<: *roombook
    entrypoint: ["roombook-consumer"]
    depends_on:
      roombook-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  roombook-relay:
    <<: *roombook
    entrypoint: ["roombook-relay"]
    depends_on:
      roombook-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  # docker compose run --rm roombook-dev pytest
  # Mounts the source; tests start PostgreSQL with testcontainers,
  # so this service talks to the host's Docker.
  roombook-dev:
    <<: *roombook
    profiles: ["dev"]
    user: root
    entrypoint: ["uv", "run", "--locked"]
    volumes:
      - ./roombook:/app
      - roombook-venv:/app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      UV_COMPILE_BYTECODE: "0"

volumes:
  roombook-venv:
